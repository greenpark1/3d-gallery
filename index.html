<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            display: none;
        }
        #info.visible {
            display: block;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        #controls.visible {
            display: block;
        }
        #closeVideo {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 18px;
            z-index: 10000;
        }
        #fullscreenPrompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 20px;
        }
        #fullscreenPrompt.hidden {
            display: none;
        }
        #enterButton {
            background: white;
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        #enterButton:hover {
            background: #f0f0f0;
        }
        #fullscreenToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 180;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }
        #fullscreenToggle:hover {
            background: rgba(255,255,255,0.4);
        }
        @media (max-width: 768px) {
            #fullscreenToggle {
                top: 10px;
                right: 10px;
                padding: 8px 12px;
                font-size: 12px;
            }
        }
        #mobileControls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            pointer-events: none;
            z-index: 150;
        }
        .joystick {
            position: absolute;
            width: 120px;
            height: 120px;
            bottom: 40px;
            pointer-events: all;
        }
        #leftJoystick {
            left: 40px;
        }
        .joystick-base {
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.2);
            border: 3px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            position: relative;
        }
        .joystick-stick {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.6);
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s;
        }
        #lookArea {
            position: fixed;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            pointer-events: all;
            z-index: 140;
        }
        @media (max-width: 768px) {
            #mobileControls {
                display: block;
            }
            #controls {
                display: none;
            }
            #info {
                font-size: 12px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="fullscreenPrompt">
        <h1>3D Gallery Experience</h1>
        <p>Tap below to enter fullscreen mode</p>
        <button id="enterButton">Enter Gallery</button>
    </div>

    <button id="fullscreenToggle" style="display: none;">⛶ Exit Fullscreen</button>
    
    <div id="info">
        <strong>3D Gallery</strong><br>
        Click to explore
    </div>
    <div id="controls">
        W/S: Forward/Backward | A/D: Strafe Left/Right | Cursor Position: Look Around | Click: Interact
    </div>
    <div id="videoModal">
        <div id="leftJoystick" class="joystick">
            <div class="joystick-base">
                <div class="joystick-stick" id="moveStick"></div>
            </div>
        </div>
        <div id="lookArea"></div>
    </div>
        <button id="closeVideo">✕</button>
        <video id="galleryVideo" controls></video>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let clickableObjects = [];
        
        // Mobile controls
        let joystickActive = false;
        let joystickStartX = 0, joystickStartY = 0;
        let joystickDeltaX = 0, joystickDeltaY = 0;
        let lookTouchId = null;
        let lookStartX = 0, lookStartY = 0;
        let isFullscreen = false;
        let doubleTapTimeout = null;
        let lastTapTime = 0;

        init();
        animate();
        
        // Fullscreen prompt handler
        document.getElementById('enterButton').addEventListener('click', () => {
            enterFullscreen();
            document.getElementById('fullscreenPrompt').classList.add('hidden');
            // Show info and controls after entering
            document.getElementById('info').classList.add('visible');
            document.getElementById('controls').classList.add('visible');
            // Reset camera position and rotation when entering
            resetCameraPosition();
        });

        function resetCameraPosition() {
            camera.position.set(0, 2.2, 8);
            camera.rotation.set(-0.3, 0, 0); // Reset to looking down position
        }

        // Fullscreen toggle button
        const toggleBtn = document.getElementById('fullscreenToggle');
        
        toggleBtn.addEventListener('click', toggleFullscreen);

        // Double-tap to toggle fullscreen (on look area for mobile)
        document.addEventListener('touchend', handleDoubleTap);

        function handleDoubleTap(e) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            
            if (tapLength < 300 && tapLength > 0) {
                // Double tap detected
                e.preventDefault();
                toggleFullscreen();
            }
            lastTapTime = currentTime;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                enterFullscreen();
            } else {
                exitFullscreen();
            }
        }

        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { // Safari
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { // IE11
                elem.msRequestFullscreen();
            }
            isFullscreen = true;
            toggleBtn.textContent = '⛶ Exit Fullscreen';
            toggleBtn.style.display = 'block';
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
            isFullscreen = false;
            toggleBtn.textContent = '⛶ Enter Fullscreen';
        }

        // Listen for fullscreen changes (ESC key, etc.)
        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

        function updateFullscreenButton() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                toggleBtn.textContent = '⛶ Exit Fullscreen';
                isFullscreen = true;
            } else {
                toggleBtn.textContent = '⛶ Enter Fullscreen';
                isFullscreen = false;
            }
        }

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            scene.fog = new THREE.Fog(0x1a1a1a, 1, 50);

            // Camera - always start at the beginning (raised 2 feet, looking down)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.2, 8);
            camera.rotation.order = 'YXZ'; // Set rotation order to prevent roll
            camera.rotation.set(-0.3, 0, 0); // Start tilted down (~17 degrees)

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const spotLight1 = new THREE.SpotLight(0xffffff, 1.0);
            spotLight1.position.set(0, 8, 0);
            spotLight1.castShadow = true;
            scene.add(spotLight1);

            const spotLight2 = new THREE.SpotLight(0xffffff, 1.0);
            spotLight2.position.set(0, 8, -15);
            scene.add(spotLight2);

            const spotLight3 = new THREE.SpotLight(0xffffff, 0.8);
            spotLight3.position.set(0, 8, -25);
            scene.add(spotLight3);

            // Corridor floor
            const corridorFloor = new THREE.Mesh(
                new THREE.PlaneGeometry(6, 20),
                new THREE.MeshStandardMaterial({ color: 0x333333 })
            );
            corridorFloor.rotation.x = -Math.PI / 2;
            corridorFloor.receiveShadow = true;
            scene.add(corridorFloor);

            // Main room floor
            const roomFloor = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 20),
                new THREE.MeshStandardMaterial({ color: 0x444444 })
            );
            roomFloor.rotation.x = -Math.PI / 2;
            roomFloor.position.z = -20;
            roomFloor.receiveShadow = true;
            scene.add(roomFloor);

            // Corridor walls
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x666666 });
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 20), wallMaterial);
            leftWall.position.set(-3, 2, 0);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 20), wallMaterial);
            rightWall.position.set(3, 2, 0);
            scene.add(rightWall);

            // Corridor objects - plant
            const plant = new THREE.Group();
            const pot = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.4, 0.6, 8),
                new THREE.MeshStandardMaterial({ color: 0x8B4513 })
            );
            const leaves = new THREE.Mesh(
                new THREE.SphereGeometry(0.5, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0x228B22 })
            );
            leaves.position.y = 0.6;
            plant.add(pot, leaves);
            plant.position.set(-2, 0.3, 3);
            scene.add(plant);

            // Corridor bench
            const bench = new THREE.Group();
            const seat = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 0.1, 0.5),
                new THREE.MeshStandardMaterial({ color: 0x8B7355 })
            );
            const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.1), wallMaterial);
            leg1.position.set(-0.6, -0.3, -0.15);
            const leg2 = leg1.clone();
            leg2.position.set(0.6, -0.3, -0.15);
            bench.add(seat, leg1, leg2);
            bench.position.set(2, 0.5, 2);
            scene.add(bench);

            // Main room walls
            const roomWallMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
            
            // Back wall
            const backWall = new THREE.Mesh(
                new THREE.BoxGeometry(20, 6, 0.2),
                roomWallMaterial
            );
            backWall.position.set(0, 3, -30);
            scene.add(backWall);

            // Left room wall
            const leftRoomWall = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, 6, 20),
                roomWallMaterial
            );
            leftRoomWall.position.set(-10, 3, -20);
            scene.add(leftRoomWall);

            // Right room wall
            const rightRoomWall = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, 6, 20),
                roomWallMaterial
            );
            rightRoomWall.position.set(10, 3, -20);
            scene.add(rightRoomWall);

            // Center seat
            const centerSeat = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.5, 2),
                new THREE.MeshStandardMaterial({ color: 0x8B0000 })
            );
            centerSeat.position.set(0, 0.25, -20);
            scene.add(centerSeat);

            // Wall artworks
            createArtwork(-9, 2.5, -20, 'painting1', 0xff6b6b, 'Abstract Art');
            createArtwork(-9, 2.5, -25, 'painting2', 0x4ecdc4, 'Landscape');
            
            createArtwork(9, 2.5, -20, 'painting3', 0xffe66d, 'Portrait');
            createArtwork(9, 2.5, -15, 'painting4', 0xa8e6cf, 'Modern Art');
            createArtwork(9, 2.5, -25, 'painting5', 0xff8b94, 'Still Life');

            createArtwork(-5, 2.5, -29.8, 'video1', 0x6c5ce7, 'Video Art 1', true);
            createArtwork(0, 2.5, -29.8, 'video2', 0xfd79a8, 'Video Art 2', true);
            createArtwork(5, 2.5, -29.8, 'painting6', 0xfdcb6e, 'Gallery Art');

            // Mouse and keyboard controls
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('click', onClick);
            document.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);

            document.getElementById('closeVideo').addEventListener('click', () => {
                const modal = document.getElementById('videoModal');
                const video = document.getElementById('galleryVideo');
                modal.classList.remove('active');
                video.pause();
                video.src = '';
            });

            document.addEventListener('click', () => {
                // Pointer lock removed - using cursor position instead
            });

            // Mobile touch controls
            setupMobileControls();
        }

        function createArtwork(x, y, z, id, color, title, isVideo = false) {
            const frame = new THREE.Mesh(
                new THREE.BoxGeometry(2, 1.5, 0.1),
                new THREE.MeshStandardMaterial({ color: color })
            );
            frame.position.set(x, y, z);
            
            if (Math.abs(z + 29.8) < 0.1) frame.rotation.y = 0;
            else if (x < 0) frame.rotation.y = Math.PI / 2;
            else frame.rotation.y = -Math.PI / 2;
            
            frame.userData = { id, title, isVideo };
            clickableObjects.push(frame);
            scene.add(frame);

            // Add label
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 64;
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.fillText(title, 10, 35);
            
            const texture = new THREE.CanvasTexture(canvas);
            const label = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 0.25),
                new THREE.MeshBasicMaterial({ map: texture, transparent: true })
            );
            label.position.set(x, y - 1, z + (Math.abs(z + 29.8) < 0.1 ? 0.1 : (x < 0 ? -0.1 : 0.1)));
            label.rotation.copy(frame.rotation);
            scene.add(label);
        }

        function onClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);
            
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (obj.userData.isVideo) {
                    // Create video modal dynamically with inline styles
                    let modal = document.getElementById('videoModal');
                    if (!modal) {
                        modal = document.createElement('div');
                        modal.id = 'videoModal';
                        modal.style.cssText = 'display:flex;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.95);z-index:9999;justify-content:center;align-items:center;';
                        modal.innerHTML = `
                            <button id="closeVideo" style="position:absolute;top:20px;right:20px;background:white;border:none;padding:10px 15px;cursor:pointer;border-radius:5px;font-size:18px;z-index:10000;">✕</button>
                            <video id="galleryVideo" controls style="max-width:80vw;max-height:60vh;"></video>
                        `;
                        document.body.appendChild(modal);
                        
                        document.getElementById('closeVideo').addEventListener('click', () => {
                            const m = document.getElementById('videoModal');
                            const v = document.getElementById('galleryVideo');
                            v.pause();
                            v.src = '';
                            m.remove();
                        });
                    }
                    
                    const video = document.getElementById('galleryVideo');
                    video.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
                    video.play();
                } else {
                    alert(`Viewing: ${obj.userData.title}`);
                }
            }
        }

        function onMouseMove(event) {
            // Normalize cursor position to -1 to 1 range
            const normalizedX = (event.clientX / window.innerWidth) * 2 - 1;
            const normalizedY = (event.clientY / window.innerHeight) * 2 - 1;
            
            // Pan (horizontal rotation) based on X position - Y axis only
            camera.rotation.y = -normalizedX * Math.PI;
            
            // Tilt (vertical rotation) - centered around -20° (looking down) - X axis only
            const centerTilt = -20 * Math.PI / 180;
            
            if (normalizedY < 0) {
                camera.rotation.x = centerTilt + (normalizedY * (20 * Math.PI / 180));
            } else {
                camera.rotation.x = centerTilt + (normalizedY * (20 * Math.PI / 180));
            }
            
            // Lock Z rotation to prevent roll
            camera.rotation.z = 0;
            
            mouse.x = normalizedX;
            mouse.y = -normalizedY;
        }

        function onKeyDown(event) {
            switch(event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(event) {
            switch(event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupMobileControls() {
            const moveJoystick = document.getElementById('leftJoystick');
            const moveStick = document.getElementById('moveStick');
            const lookArea = document.getElementById('lookArea');

            // Movement joystick
            moveJoystick.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = moveJoystick.getBoundingClientRect();
                joystickStartX = rect.left + rect.width / 2;
                joystickStartY = rect.top + rect.height / 2;
                joystickActive = true;
            });

            moveJoystick.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!joystickActive) return;
                
                const touch = e.touches[0];
                joystickDeltaX = touch.clientX - joystickStartX;
                joystickDeltaY = touch.clientY - joystickStartY;
                
                // Limit joystick range
                const distance = Math.sqrt(joystickDeltaX ** 2 + joystickDeltaY ** 2);
                const maxDistance = 35;
                if (distance > maxDistance) {
                    joystickDeltaX = (joystickDeltaX / distance) * maxDistance;
                    joystickDeltaY = (joystickDeltaY / distance) * maxDistance;
                }
                
                // Update stick position
                moveStick.style.transform = `translate(calc(-50% + ${joystickDeltaX}px), calc(-50% + ${joystickDeltaY}px))`;
                
                // Set movement flags
                moveForward = joystickDeltaY < -10;
                moveBackward = joystickDeltaY > 10;
                moveLeft = joystickDeltaX < -10;
                moveRight = joystickDeltaX > 10;
            });

            moveJoystick.addEventListener('touchend', (e) => {
                e.preventDefault();
                joystickActive = false;
                joystickDeltaX = 0;
                joystickDeltaY = 0;
                moveStick.style.transform = 'translate(-50%, -50%)';
                moveForward = moveBackward = moveLeft = moveRight = false;
            });

            // Look controls (right side of screen)
            lookArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                lookTouchId = touch.identifier;
                lookStartX = touch.clientX;
                lookStartY = touch.clientY;
            });

            lookArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === lookTouchId) {
                        const touch = e.touches[i];
                        const deltaX = touch.clientX - lookStartX;
                        const deltaY = touch.clientY - lookStartY;
                        
                        camera.rotation.y -= deltaX * 0.005;
                        camera.rotation.x -= deltaY * 0.005;
                        // Updated: No upward tilt (0°), Look down -40°
                        camera.rotation.x = Math.max(-40 * Math.PI / 180, Math.min(0, camera.rotation.x));
                        
                        lookStartX = touch.clientX;
                        lookStartY = touch.clientY;
                        break;
                    }
                }
            });

            lookArea.addEventListener('touchend', (e) => {
                e.preventDefault();
                lookTouchId = null;
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // DOOM-style movement: always on ground plane, ignores vertical look
            const speed = 0.15;
            
            // Get camera's horizontal rotation only (Y-axis)
            const yaw = camera.rotation.y;
            
            // Forward/Backward movement
            if (moveForward) {
                camera.position.x -= Math.sin(yaw) * speed;
                camera.position.z -= Math.cos(yaw) * speed;
            }
            if (moveBackward) {
                camera.position.x += Math.sin(yaw) * speed;
                camera.position.z += Math.cos(yaw) * speed;
            }
            
            // Strafe Left/Right movement (perpendicular to facing direction)
            if (moveLeft) {
                camera.position.x -= Math.cos(yaw) * speed;
                camera.position.z += Math.sin(yaw) * speed;
            }
            if (moveRight) {
                camera.position.x += Math.cos(yaw) * speed;
                camera.position.z -= Math.sin(yaw) * speed;
            }

            // Keep camera at raised eye height (2 feet higher = 2.2 units)
            camera.position.y = 2.2;

            // Boundaries
            camera.position.x = Math.max(-9, Math.min(9, camera.position.x));
            camera.position.z = Math.max(-29, Math.min(9, camera.position.z));

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
